name: D31

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d31.yml"
      - "scripts/D31.py"
      - "scripts/D31A.py"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Verify private dataset access
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "DRUMMOND_DATA_TOKEN secret is not configured" }
          $repo = "igorsegal/DRUMMOND_CLOUD"
          $tag = "dataset03-drummond_canonical_8e9a1d784e3893d9"
          $assets = @(gh api "repos/$repo/releases/tags/$tag" --jq ".assets[].name")
          if ($LASTEXITCODE -ne 0) { throw "Cannot access private dataset release." }
          $required = @(
            "DATASET_MANIFEST.json","DATASET_SYMBOLS.csv",
            "shard_001.zip","shard_002.zip","shard_003.zip","shard_004.zip",
            "shard_005.zip","shard_006.zip","shard_007.zip"
          )
          foreach ($name in $required) {
            if ($assets -notcontains $name) { throw "Private dataset release is missing required asset: $name" }
          }
          Write-Host "D31 preflight PASS"

  shard:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [shard_001.zip,shard_002.zip,shard_003.zip,shard_004.zip,shard_005.zip,shard_006.zip,shard_007.zip]
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Contract
        shell: pwsh
        run: |
          python -m py_compile scripts/D17.py scripts/D25.py scripts/D31.py scripts/D31A.py
          if ($LASTEXITCODE -ne 0) { throw "D31 syntax failed" }

      - name: Download private canonical shard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "DRUMMOND_DATA_TOKEN secret is not configured" }
          New-Item -ItemType Directory -Force -Path ".d31/pkg",".d31/data" | Out-Null
          gh release download "dataset03-drummond_canonical_8e9a1d784e3893d9" --repo "igorsegal/DRUMMOND_CLOUD" --dir ".d31/pkg" --pattern "DATASET_MANIFEST.json" --pattern "DATASET_SYMBOLS.csv" --pattern "${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "Private dataset download failed" }
          python scripts/data_bridge_verify02.py --package-dir ".d31/pkg" --out-root ".d31/data" --expected-dataset-id "DRUMMOND_CANONICAL_8E9A1D784E3893D9" --shard "${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "Dataset verification failed" }

      - name: Run D31 frozen hypothesis test
        shell: pwsh
        run: |
          python scripts/D31.py --data-root ".d31/data" --out "results/latest/d31/${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "D31 shard failed" }

      - name: Gate
        shell: pwsh
        run: |
          $s=Get-Content "results/latest/d31/${{ matrix.shard }}/D31.json" -Raw | ConvertFrom-Json
          if ($s.status -ne "PASS") { throw "D31 shard not PASS" }
          if ([int]$s.errors -ne 0) { throw "D31 errors" }
          if (-not [bool]$s.contract.hypotheses_frozen_before_run) { throw "D31 hypotheses not frozen" }
          if (-not [bool]$s.contract.all_three_tested_together) { throw "D31 incomplete hypothesis set" }
          if (-not [bool]$s.contract.horizons_frozen_before_run) { throw "D31 horizons not frozen" }
          if ([bool]$s.contract.trading_entries_used) { throw "D31 trading contamination" }
          if ([bool]$s.contract.stops_targets_used) { throw "D31 stop/target contamination" }
          if ([bool]$s.contract.pnl_used) { throw "D31 PnL contamination" }
          if ([bool]$s.contract.future_filter_used) { throw "D31 future filter violation" }
          if ([bool]$s.contract.selection_or_optimization) { throw "D31 optimization violation" }
          if ([bool]$s.contract.lookahead) { throw "D31 lookahead violation" }
          if ([bool]$s.contract.promotion_allowed) { throw "D31 promotion forbidden" }

      - uses: actions/upload-artifact@v4
        with:
          name: d31-${{ matrix.shard }}
          path: |
            results/latest/d31/${{ matrix.shard }}/D31.csv
            results/latest/d31/${{ matrix.shard }}/D31.json
            results/latest/d31/${{ matrix.shard }}/D31_ERR.json
          if-no-files-found: error

  aggregate:
    needs: shard
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5
        with:
          pattern: d31-*
          path: .d31a

      - name: Aggregate
        shell: pwsh
        run: |
          python scripts/D31A.py --root ".d31a" --out "results/latest/d31_full"
          if ($LASTEXITCODE -ne 0) { throw "D31 aggregate failed" }
          $s=Get-Content "results/latest/d31_full/D31.json" -Raw | ConvertFrom-Json
          if ($s.status -ne "PASS") { throw "D31 aggregate not PASS" }
          if (-not [bool]$s.contract.hypotheses_frozen_before_run) { throw "D31 hypotheses not frozen" }
          if (-not [bool]$s.contract.all_three_tested_together) { throw "D31 incomplete hypothesis set" }
          if ([bool]$s.contract.trading_entries_used) { throw "D31 trading contamination" }
          if ([bool]$s.contract.stops_targets_used) { throw "D31 stop/target contamination" }
          if ([bool]$s.contract.pnl_used) { throw "D31 PnL contamination" }
          if ([bool]$s.contract.future_filter_used) { throw "D31 future filter violation" }
          if ([bool]$s.contract.selection_or_optimization) { throw "D31 optimization violation" }
          if ([bool]$s.contract.lookahead) { throw "D31 lookahead violation" }
          if ([bool]$s.contract.promotion_allowed) { throw "D31 promotion forbidden" }
          Get-Content "results/latest/d31_full/D31.txt" | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: d31-full
          path: results/latest/d31_full/
          if-no-files-found: error
