name: CURRENCY STRENGTH CS13

on:
  workflow_dispatch:
    inputs:
      dataset_tag:
        description: Canonical dataset release tag
        required: true
        default: dataset03-drummond_canonical_8e9a1d784e3893d9
  push:
    paths:
      - '.github/workflows/currency_strength_cs13.yml'
      - 'scripts/CS13.py'

permissions:
  contents: read

jobs:
  cs13:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Syntax contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/CS13.py scripts/drummond_replay01.py

      - name: Download canonical manifest and FX shards
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
          TAG: ${{ inputs.dataset_tag || 'dataset03-drummond_canonical_8e9a1d784e3893d9' }}
        run: |
          set -euo pipefail
          mkdir -p .dataset
          gh release download "$TAG" --repo igorsegal/DRUMMOND_CLOUD --dir .dataset --pattern DATASET_MANIFEST.csv
          for n in 001 002 003 004 005 006; do
            gh release download "$TAG" --repo igorsegal/DRUMMOND_CLOUD --dir .dataset --pattern "shard_${n}.zip"
          done

      - name: Extract and verify H1 plus M5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,pathlib,zipfile
          pairs=set('AUDCAD AUDCHF AUDJPY AUDNZD AUDUSD CADCHF CADJPY CHFJPY EURAUD EURCAD EURCHF EURGBP EURJPY EURNZD EURUSD GBPAUD GBPCAD GBPCHF GBPJPY GBPNZD GBPUSD NZDCAD NZDCHF NZDJPY NZDUSD USDCAD USDCHF USDJPY'.split())
          discovery='EURUSD'
          with open('.dataset/DATASET_MANIFEST.csv',newline='',encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          wanted=[]
          for r in rows:
              if r['symbol'] not in pairs: continue
              if r['tf']=='H1' or (r['tf']=='M5' and r['symbol']!=discovery):
                  wanted.append(r)
          h1=[r for r in wanted if r['tf']=='H1']; m5=[r for r in wanted if r['tf']=='M5']
          assert len(h1)==28, len(h1)
          assert len(m5)==27, len(m5)
          out=pathlib.Path('.fx'); out.mkdir(exist_ok=True)
          by={}
          for r in wanted: by.setdefault(r['shard'],[]).append(r)
          for shard,rr in sorted(by.items()):
              with zipfile.ZipFile(pathlib.Path('.dataset')/shard) as z:
                  names=set(z.namelist())
                  for r in rr:
                      rel=r['relative_path'].replace('\\','/')
                      if rel not in names: raise SystemExit('missing '+rel)
                      z.extract(rel,out)
                      p=out/rel
                      h=hashlib.sha256(p.read_bytes()).hexdigest()
                      if h.lower()!=r['sha256'].lower(): raise SystemExit('SHA mismatch '+rel)
                      print('PASS',rel,r['bar_count'])
          PY

      - name: Run CS13
        shell: bash
        run: |
          set -euo pipefail
          python scripts/CS13.py --root .fx --out results/latest/cs13
          cat results/latest/cs13/CS13.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('results/latest/cs13/CS13.json').read_text())
          assert s['status']=='PASS'
          assert len(s['targets'])==27
          c=s['contract']
          assert c['recorded_m5_spread_applied'] is True
          assert c['one_position_per_target_horizon'] is True
          assert c['parameter_optimization'] is False
          assert c['fresh_out_of_sample_validation'] is False
          print('CS13 gate PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: currency-strength-cs13
          path: results/latest/cs13/
          if-no-files-found: error
