name: TAKBIR T03

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/takbir_t03.yml"
      - "scripts/T01.py"
      - "scripts/T03.py"
      - "scripts/T03A.py"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Verify private dataset access
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "DRUMMOND_DATA_TOKEN secret is not configured" }
          $repo = "igorsegal/DRUMMOND_CLOUD"
          $tag = "dataset03-drummond_canonical_8e9a1d784e3893d9"
          $assets = @(gh api "repos/$repo/releases/tags/$tag" --jq ".assets[].name")
          if ($LASTEXITCODE -ne 0) { throw "Cannot access private dataset release." }
          $required = @("DATASET_MANIFEST.json","DATASET_SYMBOLS.csv","shard_001.zip","shard_002.zip","shard_003.zip","shard_004.zip","shard_005.zip","shard_006.zip","shard_007.zip")
          foreach ($name in $required) { if ($assets -notcontains $name) { throw "Missing private dataset asset: $name" } }
          Write-Host "TAKBIR T03 preflight PASS"

  shard:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [shard_001.zip,shard_002.zip,shard_003.zip,shard_004.zip,shard_005.zip,shard_006.zip,shard_007.zip]
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Contract
        shell: pwsh
        run: |
          python -m py_compile scripts/T01.py scripts/T03.py scripts/T03A.py
          if ($LASTEXITCODE -ne 0) { throw "T03 syntax failed" }

      - name: Download private canonical shard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path ".t03/pkg",".t03/data" | Out-Null
          gh release download "dataset03-drummond_canonical_8e9a1d784e3893d9" --repo "igorsegal/DRUMMOND_CLOUD" --dir ".t03/pkg" --pattern "DATASET_MANIFEST.json" --pattern "DATASET_SYMBOLS.csv" --pattern "${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "Private dataset download failed" }
          python scripts/data_bridge_verify02.py --package-dir ".t03/pkg" --out-root ".t03/data" --expected-dataset-id "DRUMMOND_CANONICAL_8E9A1D784E3893D9" --shard "${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "Dataset verification failed" }

      - name: Run T03
        shell: pwsh
        run: |
          python scripts/T03.py --data-root ".t03/data" --out "results/latest/t03/${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "T03 failed" }

      - name: Gate
        shell: pwsh
        run: |
          $s=Get-Content "results/latest/t03/${{ matrix.shard }}/T03.json" -Raw | ConvertFrom-Json
          if ($s.status -ne "PASS") { throw "T03 shard not PASS" }
          if ([int]$s.errors -ne 0) { throw "T03 errors" }
          if ([bool]$s.contract.lookahead) { throw "T03 lookahead violation" }
          if ([bool]$s.contract.selection_or_optimization) { throw "T03 optimization violation" }
          if ([bool]$s.contract.pyramiding) { throw "T03 pyramiding violation" }

      - uses: actions/upload-artifact@v4
        with:
          name: t03-${{ matrix.shard }}
          path: |
            results/latest/t03/${{ matrix.shard }}/T03.csv
            results/latest/t03/${{ matrix.shard }}/T03.json
            results/latest/t03/${{ matrix.shard }}/T03_ERR.json
          if-no-files-found: error

  aggregate:
    needs: shard
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5
        with:
          pattern: t03-*
          path: .t03_all

      - name: Aggregate T03
        shell: pwsh
        run: |
          python scripts/T03A.py --root ".t03_all" --out "results/latest/t03_full"
          if ($LASTEXITCODE -ne 0) { throw "T03 aggregate failed" }
          Get-Content "results/latest/t03_full/T03.txt" | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: takbir-t03-full
          path: results/latest/t03_full/
          if-no-files-found: error
