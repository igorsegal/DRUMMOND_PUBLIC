name: N28 FULL USD PREP

on:
  push:
    paths:
      - '.github/workflows/n28_full_usd_prep.yml'
      - 'scripts/ND03_PREP.py'

permissions:
  contents: read
  actions: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Syntax
        run: python -m py_compile scripts/ND03_PREP.py scripts/drummond_replay01.py

      - name: Download verified USD26 Jan-Sep artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .news
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10938096526/zip" > /tmp/usd26.zip
          unzip -q /tmp/usd26.zip -d .news
          test -s .news/USD26_2026_JAN_SEP.csv
          cp .news/USD26_2026_JAN_SEP.csv .news/USD26.csv
          python - <<'PY'
          import csv,hashlib
          p='.news/USD26.csv'
          rows=list(csv.DictReader(open(p,encoding='utf-8-sig'),delimiter=';'))
          assert len(rows)==201, len(rows)
          assert all(r['CURRENCY']=='USD' and r['IMPACT']=='HIGH' for r in rows)
          print('USD26_INPUT_PASS rows',len(rows))
          print('USD26_SHA256',hashlib.sha256(open(p,'rb').read()).hexdigest())
          PY

      - name: Download canonical manifest
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
          TAG: dataset03-drummond_canonical_8e9a1d784e3893d9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dataset
          gh release download "$TAG" --repo igorsegal/DRUMMOND_CLOUD --dir .dataset --pattern DATASET_MANIFEST.csv

      - name: Resolve required seven USD M5 legs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,pathlib
          need=set("AUDUSD USDCAD USDCHF EURUSD GBPUSD NZDUSD USDJPY".split())
          with open('.dataset/DATASET_MANIFEST.csv',newline='',encoding='utf-8-sig') as f:
              rows=[r for r in csv.DictReader(f) if r.get('symbol') in need and r.get('tf')=='M5']
          assert len(rows)==7, (len(rows), sorted((r.get('symbol'),r.get('tf')) for r in rows))
          shards=sorted(set(r['shard'] for r in rows))
          pathlib.Path('.dataset/needed_shards.txt').write_text('\n'.join(shards)+'\n')
          print('LEGS',sorted(r['symbol'] for r in rows))
          print('SHARDS',shards)
          PY

      - name: Download only required shards
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
          TAG: dataset03-drummond_canonical_8e9a1d784e3893d9
        shell: bash
        run: |
          set -euo pipefail
          while read S; do
            echo "[DOWNLOAD] $S"
            gh release download "$TAG" --repo igorsegal/DRUMMOND_CLOUD --dir .dataset --pattern "$S"
          done < .dataset/needed_shards.txt

      - name: Extract and verify seven USD M5 legs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,pathlib,zipfile
          need=set("AUDUSD USDCAD USDCHF EURUSD GBPUSD NZDUSD USDJPY".split())
          with open('.dataset/DATASET_MANIFEST.csv',newline='',encoding='utf-8-sig') as f:
              rows=[r for r in csv.DictReader(f) if r.get('symbol') in need and r.get('tf')=='M5']
          out=pathlib.Path('.fx'); out.mkdir(exist_ok=True)
          by={}
          for r in rows: by.setdefault(r['shard'],[]).append(r)
          for shard,rr in by.items():
              zp=pathlib.Path('.dataset')/shard
              with zipfile.ZipFile(zp) as z:
                  names=set(z.namelist())
                  for r in rr:
                      rel=r['relative_path'].replace('\\','/')
                      assert rel in names, rel
                      z.extract(rel,out)
                      p=out/rel
                      h=hashlib.sha256(p.read_bytes()).hexdigest()
                      assert h.lower()==r['sha256'].lower(), rel
                      print('PASS',r['symbol'],r['tf'],r['bar_count'],rel)
          PY

      - name: Build full Jan-Sep external USD strength
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ND03_PREP.py --root .fx --news .news/USD26.csv --out results/latest/n28
          cat results/latest/n28/ND03.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,hashlib,pathlib
          p=pathlib.Path('results/latest/n28/USD26.csv')
          assert p.exists() and p.stat().st_size>100
          rows=list(csv.DictReader(p.open(encoding='utf-8-sig'),delimiter=';'))
          assert rows
          assert all(r['LEG_COUNT']=='7' for r in rows)
          assert all(r['UTC_TIME'].startswith('2026-') for r in rows)
          keys=[r['UTC_TIME'] for r in rows]
          assert len(keys)==len(set(keys))
          print('N28 GATE PASS rows',len(rows),'first',rows[0]['UTC_TIME'],'last',rows[-1]['UTC_TIME'])
          print('N28_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: n28-full-usd-precomputed
          path: results/latest/n28/
          if-no-files-found: error
