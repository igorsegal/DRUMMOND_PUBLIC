name: NEWS26 FF PROBE

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/news26_ff_probe.yml'
      - 'scripts/NEWS26_FF.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install selenium==4.13.0
      - name: Collect Aug 9 week
        run: |
          set -euo pipefail
          python scripts/NEWS26_FF.py --start 2026-08-09 --out week.csv
          cat week.csv
      - name: Sanity gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          with open('week.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f,delimiter=';'))
          keys={(r['UTC_TIME'],r['CURRENCY'],r['EVENT']) for r in rows}
          checks=[
            ('2026-08-11T04:30:00Z','AUD','Cash Rate'),
            ('2026-08-12T12:30:00Z','USD','CPI m/m'),
            ('2026-08-13T06:00:00Z','GBP','GDP m/m'),
          ]
          for x in checks:
              ok=x in keys
              print('CHECK',x,ok)
              assert ok,x
          print('SANITY PASS high=',len(rows))
          PY
