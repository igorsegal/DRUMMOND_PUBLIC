name: TAKBIR T01-T02

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/takbir_t01_t02.yml"
      - "scripts/T01.py"
      - "scripts/T01A.py"
      - "scripts/T02.py"
      - "scripts/T02A.py"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Verify private dataset access
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "DRUMMOND_DATA_TOKEN secret is not configured" }
          $repo = "igorsegal/DRUMMOND_CLOUD"
          $tag = "dataset03-drummond_canonical_8e9a1d784e3893d9"
          $assets = @(gh api "repos/$repo/releases/tags/$tag" --jq ".assets[].name")
          if ($LASTEXITCODE -ne 0) { throw "Cannot access private dataset release." }
          $required = @("DATASET_MANIFEST.json","DATASET_SYMBOLS.csv","shard_001.zip","shard_002.zip","shard_003.zip","shard_004.zip","shard_005.zip","shard_006.zip","shard_007.zip")
          foreach ($name in $required) { if ($assets -notcontains $name) { throw "Missing private dataset asset: $name" } }
          Write-Host "TAKBIR preflight PASS"

  shard:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [shard_001.zip,shard_002.zip,shard_003.zip,shard_004.zip,shard_005.zip,shard_006.zip,shard_007.zip]
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Contract
        shell: pwsh
        run: |
          python -m py_compile scripts/T01.py scripts/T01A.py scripts/T02.py scripts/T02A.py
          if ($LASTEXITCODE -ne 0) { throw "TAKBIR syntax failed" }

      - name: Download private canonical shard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path ".takbir/pkg",".takbir/data" | Out-Null
          gh release download "dataset03-drummond_canonical_8e9a1d784e3893d9" --repo "igorsegal/DRUMMOND_CLOUD" --dir ".takbir/pkg" --pattern "DATASET_MANIFEST.json" --pattern "DATASET_SYMBOLS.csv" --pattern "${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "Private dataset download failed" }
          python scripts/data_bridge_verify02.py --package-dir ".takbir/pkg" --out-root ".takbir/data" --expected-dataset-id "DRUMMOND_CANONICAL_8E9A1D784E3893D9" --shard "${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "Dataset verification failed" }

      - name: Run T01 causal reconstruction
        shell: pwsh
        run: |
          python scripts/T01.py --data-root ".takbir/data" --out "results/latest/t01/${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "T01 failed" }

      - name: Run T02 predictive audit
        shell: pwsh
        run: |
          python scripts/T02.py --data-root ".takbir/data" --out "results/latest/t02/${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "T02 failed" }

      - name: Gate
        shell: pwsh
        run: |
          $t1=Get-Content "results/latest/t01/${{ matrix.shard }}/T01.json" -Raw | ConvertFrom-Json
          $t2=Get-Content "results/latest/t02/${{ matrix.shard }}/T02.json" -Raw | ConvertFrom-Json
          if ($t1.status -ne "PASS" -or $t2.status -ne "PASS") { throw "TAKBIR shard not PASS" }
          if ([int]$t1.errors -ne 0 -or [int]$t2.errors -ne 0) { throw "TAKBIR errors" }
          if ([bool]$t1.contract.lookahead -or [bool]$t2.contract.lookahead) { throw "TAKBIR lookahead violation" }
          if ([bool]$t1.contract.selection_or_optimization -or [bool]$t2.contract.selection_or_optimization) { throw "TAKBIR optimization violation" }
          if (-not [bool]$t1.contract.five_bars_right_required) { throw "T01 causal confirmation violation" }

      - uses: actions/upload-artifact@v4
        with:
          name: takbir-${{ matrix.shard }}
          path: |
            results/latest/t01/${{ matrix.shard }}/T01.csv
            results/latest/t01/${{ matrix.shard }}/T01.json
            results/latest/t01/${{ matrix.shard }}/T01_ERR.json
            results/latest/t02/${{ matrix.shard }}/T02.csv
            results/latest/t02/${{ matrix.shard }}/T02.json
            results/latest/t02/${{ matrix.shard }}/T02_ERR.json
          if-no-files-found: error

  aggregate:
    needs: shard
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5
        with:
          pattern: takbir-*
          path: .takbir_all

      - name: Aggregate T01
        shell: pwsh
        run: |
          python scripts/T01A.py --root ".takbir_all" --out "results/latest/t01_full"
          if ($LASTEXITCODE -ne 0) { throw "T01 aggregate failed" }

      - name: Aggregate T02
        shell: pwsh
        run: |
          python scripts/T02A.py --root ".takbir_all" --out "results/latest/t02_full"
          if ($LASTEXITCODE -ne 0) { throw "T02 aggregate failed" }
          Get-Content "results/latest/t01_full/T01.txt" | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Get-Content "results/latest/t02_full/T02.txt" | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: takbir-t01-t02-full
          path: |
            results/latest/t01_full/
            results/latest/t02_full/
          if-no-files-found: error
