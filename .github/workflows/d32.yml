name: D32

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/d32.yml"
      - "scripts/D32.py"
      - "scripts/D32A.py"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Verify private dataset access
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "DRUMMOND_DATA_TOKEN secret is not configured" }
          $repo = "igorsegal/DRUMMOND_CLOUD"
          $tag = "dataset03-drummond_canonical_8e9a1d784e3893d9"
          $assets = @(gh api "repos/$repo/releases/tags/$tag" --jq ".assets[].name")
          if ($LASTEXITCODE -ne 0) { throw "Cannot access private dataset release." }
          $required = @(
            "DATASET_MANIFEST.json","DATASET_SYMBOLS.csv",
            "shard_001.zip","shard_002.zip","shard_003.zip","shard_004.zip",
            "shard_005.zip","shard_006.zip","shard_007.zip"
          )
          foreach ($name in $required) {
            if ($assets -notcontains $name) { throw "Missing private dataset asset: $name" }
          }
          Write-Host "D32 preflight PASS"

  shard:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        shard: [shard_001.zip,shard_002.zip,shard_003.zip,shard_004.zip,shard_005.zip,shard_006.zip,shard_007.zip]
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Contract
        shell: pwsh
        run: |
          python -m py_compile scripts/D17.py scripts/D25.py scripts/D32.py scripts/D32A.py
          if ($LASTEXITCODE -ne 0) { throw "D32 syntax failed" }

      - name: Download private canonical shard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DRUMMOND_DATA_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "DRUMMOND_DATA_TOKEN secret is not configured" }
          New-Item -ItemType Directory -Force -Path ".d32/pkg",".d32/data" | Out-Null
          gh release download "dataset03-drummond_canonical_8e9a1d784e3893d9" --repo "igorsegal/DRUMMOND_CLOUD" --dir ".d32/pkg" --pattern "DATASET_MANIFEST.json" --pattern "DATASET_SYMBOLS.csv" --pattern "${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "Private dataset download failed" }
          python scripts/data_bridge_verify02.py --package-dir ".d32/pkg" --out-root ".d32/data" --expected-dataset-id "DRUMMOND_CANONICAL_8E9A1D784E3893D9" --shard "${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "Dataset verification failed" }

      - name: Run D32 frozen intersection
        shell: pwsh
        run: |
          python scripts/D32.py --data-root ".d32/data" --out "results/latest/d32/${{ matrix.shard }}"
          if ($LASTEXITCODE -ne 0) { throw "D32 shard failed" }

      - name: Gate
        shell: pwsh
        run: |
          $s=Get-Content "results/latest/d32/${{ matrix.shard }}/D32.json" -Raw | ConvertFrom-Json
          if ($s.status -ne "PASS") { throw "D32 shard not PASS" }
          if ([int]$s.errors -ne 0) { throw "D32 errors" }
          if (-not [bool]$s.contract.single_hypothesis_frozen_before_run) { throw "D32 hypothesis not frozen" }
          if (-not [bool]$s.contract.groups_frozen_before_run) { throw "D32 groups not frozen" }
          if (-not [bool]$s.contract.horizons_frozen_before_run) { throw "D32 horizons not frozen" }
          if ([bool]$s.contract.trading_entries_used) { throw "D32 trading contamination" }
          if ([bool]$s.contract.stops_targets_used) { throw "D32 stop/target contamination" }
          if ([bool]$s.contract.pnl_used) { throw "D32 PnL contamination" }
          if ([bool]$s.contract.future_filter_used) { throw "D32 future filter violation" }
          if ([bool]$s.contract.selection_or_optimization) { throw "D32 optimization violation" }
          if ([bool]$s.contract.lookahead) { throw "D32 lookahead violation" }
          if ([bool]$s.contract.promotion_allowed) { throw "D32 promotion forbidden" }

      - uses: actions/upload-artifact@v4
        with:
          name: d32-${{ matrix.shard }}
          path: |
            results/latest/d32/${{ matrix.shard }}/D32.csv
            results/latest/d32/${{ matrix.shard }}/D32.json
            results/latest/d32/${{ matrix.shard }}/D32_ERR.json
          if-no-files-found: error

  aggregate:
    needs: shard
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v5
        with:
          pattern: d32-*
          path: .d32a

      - name: Aggregate
        shell: pwsh
        run: |
          python scripts/D32A.py --root ".d32a" --out "results/latest/d32_full"
          if ($LASTEXITCODE -ne 0) { throw "D32 aggregate failed" }
          $s=Get-Content "results/latest/d32_full/D32.json" -Raw | ConvertFrom-Json
          if ($s.status -ne "PASS") { throw "D32 aggregate not PASS" }
          if (-not [bool]$s.contract.single_hypothesis_frozen_before_run) { throw "D32 hypothesis not frozen" }
          if (-not [bool]$s.contract.groups_frozen_before_run) { throw "D32 groups not frozen" }
          if (-not [bool]$s.contract.horizons_frozen_before_run) { throw "D32 horizons not frozen" }
          if ([bool]$s.contract.trading_entries_used) { throw "D32 trading contamination" }
          if ([bool]$s.contract.stops_targets_used) { throw "D32 stop/target contamination" }
          if ([bool]$s.contract.pnl_used) { throw "D32 PnL contamination" }
          if ([bool]$s.contract.future_filter_used) { throw "D32 future filter violation" }
          if ([bool]$s.contract.selection_or_optimization) { throw "D32 optimization violation" }
          if ([bool]$s.contract.lookahead) { throw "D32 lookahead violation" }
          if ([bool]$s.contract.promotion_allowed) { throw "D32 promotion forbidden" }
          Get-Content "results/latest/d32_full/D32.txt" | Add-Content $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: d32-full
          path: results/latest/d32_full/
          if-no-files-found: error
